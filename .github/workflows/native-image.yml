name: JVM and Native Image verification

on:
  push:
    branches: [codex/graalvm-native, codex/sqlite-default]
    tags: ['[0-9]*']
    paths:
      - 'springboot-backend/**'
      - 'scripts/**'
      - 'docker-compose*.yml'
      - 'panel_install.sh'
      - 'docs/sqlite-operations.md'
      - '.github/workflows/native-image.yml'
  pull_request:
    branches: [main, codex/postgresql-support, codex/graalvm-native]
    paths:
      - 'springboot-backend/**'
      - 'scripts/**'
      - 'docker-compose*.yml'
      - 'panel_install.sh'
      - 'docs/sqlite-operations.md'
      - '.github/workflows/native-image.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: native-image-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: ${{ matrix.runtime }} / ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - {runtime: jvm, arch: amd64, runner: ubuntu-24.04}
          - {runtime: native, arch: amd64, runner: ubuntu-24.04}
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: flux
          POSTGRES_USER: flux
          POSTGRES_PASSWORD: ci-test-password
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U flux -d flux"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 15
    env:
      PGHOST: 127.0.0.1
      PGPORT: '5432'
      PGDATABASE: flux
      PGUSER: flux
      PGPASSWORD: ci-test-password
      DB_HOST: 127.0.0.1
      DB_PORT: '5432'
      DB_NAME: flux
      DB_USER: flux
      DB_PASSWORD: ci-test-password
      JWT_SECRET: ci-integration-only-32-character-secret
      LOG_DIR: /tmp/flux-logs
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y postgresql-client
          python -m pip install 'websocket-client==1.8.0' 'cryptography>=44,<50'
      # Both JVM and Native use the runner's shared Maven cache.
      - name: Set up Java 21 and restore shared Maven cache
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: springboot-backend/pom.xml
      - name: Install GraalVM Community JDK 21
        if: matrix.runtime == 'native'
        uses: graalvm/setup-graalvm@v1
        with:
          java-version: '21'
          distribution: graalvm-community
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Restore Native Maven dependencies
        if: matrix.runtime == 'native'
        id: native-cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.m2/repository
          key: native-maven-v2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('springboot-backend/pom.xml') }}
          restore-keys: |
            native-maven-v2-${{ runner.os }}-${{ runner.arch }}-
      - name: Package application with Spring AOT
        if: matrix.runtime == 'native'
        working-directory: springboot-backend
        env:
          DB_TYPE: sqlite
          DB_PATH: /tmp/flux-aot-build.db
        run: bash ci/mvn_retry.sh aot-build.log -Pnative -DskipTests package
      # Save before any runtime test can fail; dependency cache must survive red CI.
      - name: Save resolved Native Maven dependencies
        if: matrix.runtime == 'native' && steps.native-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/.m2/repository
          key: ${{ steps.native-cache.outputs.cache-primary-key }}
      - name: Run AOT JVM regression before Native compilation
        if: matrix.runtime == 'native'
        working-directory: springboot-backend
        run: |
          bash ../scripts/ci_aot_preflight.sh target/admin-0.0.1-SNAPSHOT.jar sqlite
          bash ../scripts/ci_aot_preflight.sh target/admin-0.0.1-SNAPSHOT.jar postgresql
      - name: Compile Native Image
        if: matrix.runtime == 'native'
        working-directory: springboot-backend
        env:
          DB_TYPE: sqlite
          DB_PATH: /tmp/flux-aot-build.db
        run: |
          set -euo pipefail
          native-image --version
          bash ci/mvn_retry.sh native-build.log -Pnative -DskipTests native:compile
          mkdir -p native
          cp target/flux-panel native/flux-panel
          file native/flux-panel
          ldd native/flux-panel
          docker build -f Dockerfile.native -t flux-backend:ci .
      - name: Package JVM on the runner using the Maven cache
        if: matrix.runtime == 'jvm'
        working-directory: springboot-backend
        run: |
          bash ci/mvn_retry.sh jvm-build.log -DskipTests package
          mkdir -p jvm
          cp target/admin-0.0.1-SNAPSHOT.jar jvm/app.jar
      - name: Build JVM Image from prebuilt JAR (no Maven downloads)
        if: matrix.runtime == 'jvm'
        run: docker build --target prebuilt -t flux-backend:ci springboot-backend
      - name: Test default SQLite container, persistence and backup recovery
        run: bash scripts/ci_backend_container.sh flux-backend:ci reports/${{ matrix.runtime }}-${{ matrix.arch }}-sqlite.json sqlite
      - name: Test legacy PostgreSQL container and record resource metrics
        env:
          FLUX_PG_CONTAINER: ${{ job.services.postgres.id }}
        run: bash scripts/ci_backend_container.sh flux-backend:ci reports/${{ matrix.runtime }}-${{ matrix.arch }}-postgresql.json postgresql
      - name: Verify automatic MySQL and PostgreSQL archive import on startup
        run: python scripts/test_legacy_import.py --container flux-backend:ci
      - name: Compare idle deployment memory
        run: |
          python - <<'PY'
          import json, pathlib, os
          reports = {r["engine"]: r for p in pathlib.Path("reports").glob("*.json") for r in [json.loads(p.read_text())]}
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as out:
              print("| Engine | Backend idle MiB | Combined idle MiB | Ready ms |", file=out)
              print("|---|---:|---:|---:|", file=out)
              for key in ("sqlite", "postgresql"):
                  r = reports[key]
                  print(f"| {key} | {r['idle_cgroup_bytes']/1048576:.2f} | {r['combined_idle_cgroup_bytes']/1048576:.2f} | {r['ready_ms']} |", file=out)
          PY
      - name: Upload test reports and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verification-${{ matrix.runtime }}-${{ matrix.arch }}
          path: |
            reports/
            springboot-backend/native-build.log
            springboot-backend/jvm-build.log
            springboot-backend/aot-build.log
            springboot-backend/aot-preflight-*.log
          if-no-files-found: warn
      - name: Upload verified native executable
        if: matrix.runtime == 'native'
        uses: actions/upload-artifact@v4
        with:
          name: native-${{ matrix.arch }}
          path: springboot-backend/native/flux-panel
          if-no-files-found: error

  publish-native:
    # Experimental branch only, or version tag. No publication for PRs.
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/codex/graalvm-native' || github.ref == 'refs/heads/codex/sqlite-default' || startsWith(github.ref, 'refs/tags/'))
    needs: verify
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: native-amd64
          path: springboot-backend/native
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Require matching published node assets before publishing panel
        if: github.ref == 'refs/heads/codex/sqlite-default' || startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/wait_for_node_release.sh
      - name: Publish verified AMD64 Native image
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/flux-panel-backend
        run: |
          set -euo pipefail
          tags=(-t "$IMAGE:sha-$(echo "$GITHUB_SHA" | cut -c1-7)-native")
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            tags+=(-t "$IMAGE:$GITHUB_REF_NAME-native")
          elif [[ "$GITHUB_REF" == refs/heads/codex/sqlite-default ]]; then
            tags+=(-t "$IMAGE:sqlite-native")
          else
            tags+=(-t "$IMAGE:graalvm-native")
          fi
          node_release_tag=sqlite-default
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then node_release_tag="$GITHUB_REF_NAME"; fi
          docker buildx build --platform linux/amd64 --push \
            --build-arg FLUX_NODE_RELEASE_REPO="$GITHUB_REPOSITORY" \
            --build-arg FLUX_NODE_RELEASE_TAG="$node_release_tag" \
            "${tags[@]}" -f springboot-backend/Dockerfile.native springboot-backend
