name: CI and Container Publishing

on:
  push:
    branches:
      - main
      - codex/postgresql-support
      - codex/graalvm-native
      - codex/sqlite-default
      - codex/passkey-auth
    tags:
      - '[0-9]*'
  pull_request:
    branches:
      - main
      - codex/postgresql-support
      - codex/graalvm-native
      - codex/sqlite-default
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: flux-panel-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  test-postgres:
    name: SQLite and PostgreSQL integration and migration
    runs-on: ubuntu-latest
    env:
      PGHOST: 127.0.0.1
      PGPORT: '5432'
      PGUSER: flux
      PGPASSWORD: test-password
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: flux
          MYSQL_USER: flux
          MYSQL_PASSWORD: test-password
          MYSQL_ROOT_PASSWORD: test-root-password
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h localhost"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 15
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: flux
          POSTGRES_USER: flux
          POSTGRES_PASSWORD: test-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U flux -d flux"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: springboot-backend/pom.xml
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install PostgreSQL client
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y postgresql-client
      - name: Verify MySQL to PostgreSQL migration and rollback
        env:
          MYSQL_HOST: 127.0.0.1
          MYSQL_PORT: '3306'
          MYSQL_USER: flux
          MYSQL_PASSWORD: test-password
          MYSQL_DATABASE: flux
          PGDATABASE: flux_migration
        run: |
          set -euo pipefail
          git show b83f6c0023198de18ee9e43441a2623363219917:gost.sql | docker exec -i "${{ job.services.mysql.id }}" sh -c 'export MYSQL_PWD="$MYSQL_ROOT_PASSWORD"; exec mysql -u root flux'
          docker exec -i "${{ job.services.mysql.id }}" sh -c 'export MYSQL_PWD="$MYSQL_ROOT_PASSWORD"; exec mysql -u root flux' <<'SQL'
          INSERT INTO node (id,name,secret,server_ip,port_sta,port_end,created_time,status) VALUES (11,'node','secret','127.0.0.1',1000,2000,1,1);
          INSERT INTO tunnel (id,name,in_node_id,in_ip,out_node_id,out_ip,type,flow,created_time,updated_time,status) VALUES (12,'tunnel',11,'::1',11,'::1',1,2,1,1,1);
          INSERT INTO forward (id,user_id,user_name,name,tunnel_id,in_port,remote_addr,created_time,updated_time,status) VALUES (13,1,'admin_user','forward',12,1234,'example',1,1,1);
          INSERT INTO speed_limit (id,name,speed,tunnel_id,tunnel_name,created_time,status) VALUES (14,'limit',100,12,'tunnel',1,1);
          INSERT INTO user_tunnel (id,user_id,tunnel_id,speed_id,num,flow,flow_reset_time,exp_time,status) VALUES (15,1,12,14,1,100,0,2727251700000,1);
          INSERT INTO statistics_flow (id,user_id,flow,total_flow,time,created_time) VALUES (16,1,123,456,'2026-11-24',1);
          SQL
          psql -d postgres -v ON_ERROR_STOP=1 -c 'CREATE DATABASE flux_migration'
          psql -v ON_ERROR_STOP=1 -f gost-schema.sql
          python -m pip install -r scripts/requirements-migration.txt
          python scripts/migrate_mysql_to_postgresql.py
          test "$(psql -Atc 'SELECT count(*) FROM app_user')" = 1
          test "$(psql -Atc 'SELECT count(*) FROM forward')" = 1
          if python scripts/migrate_mysql_to_postgresql.py; then
            echo 'ERROR: non-empty target migration was accepted'
            exit 1
          fi
          psql -d postgres -v ON_ERROR_STOP=1 -c 'CREATE DATABASE flux_migration_fail'
          export PGDATABASE=flux_migration_fail
          psql -v ON_ERROR_STOP=1 -f gost-schema.sql
          docker exec "${{ job.services.mysql.id }}" sh -c 'export MYSQL_PWD="$MYSQL_ROOT_PASSWORD"; mysql -u root flux -e "ALTER TABLE vite_config ADD COLUMN unexpected_extra INT"'
          if python scripts/migrate_mysql_to_postgresql.py; then
            echo 'ERROR: mismatched source schema was accepted'
            exit 1
          fi
          test "$(psql -Atc 'SELECT count(*) FROM forward')" = 0
      - name: Verify PostgreSQL to SQLite migration and no-overwrite rollback
        env:
          PGDATABASE: flux_migration
        run: python scripts/test_sqlite_migration.py
      - name: Verify startup import parser and real backup formats
        env:
          PGDATABASE: flux_migration
          MYSQL_CONTAINER: ${{ job.services.mysql.id }}
        run: |
          set -euo pipefail
          python scripts/test_legacy_import.py
          scratch="$(mktemp -d)"
          trap 'rm -rf "$scratch"' EXIT
          docker exec "$MYSQL_CONTAINER" sh -c 'export MYSQL_PWD="$MYSQL_ROOT_PASSWORD"; mysql -u root flux -e "ALTER TABLE vite_config DROP COLUMN unexpected_extra"'
          docker exec "$MYSQL_CONTAINER" sh -c 'export MYSQL_PWD="$MYSQL_ROOT_PASSWORD"; exec mysqldump -u root flux' | gzip > "$scratch/mysql.sql.gz"
          pg_dump -Fc | gzip > "$scratch/pg.sql.gz"
          pg_dump --no-owner --no-privileges > "$scratch/pg-plain.sql"
          python scripts/test_legacy_import.py --actual "$scratch/mysql.sql.gz" "$scratch/pg.sql.gz" "$scratch/pg-plain.sql"
      - name: Check scripts and Compose variants
        env:
          JWT_SECRET: integration-test-secret-at-least-32-characters
          DB_NAME: flux
          DB_USER: flux
          DB_PASSWORD: test-password
          BACKEND_PORT: '6365'
          FRONTEND_PORT: '6366'
        run: |
          set -euo pipefail
          for script in panel_install.sh scripts/ci_backend_container.sh scripts/ci_aot_preflight.sh springboot-backend/docker/start-backend.sh; do bash -n "$script"; done
          python -m py_compile scripts/*.py springboot-backend/docker/import_legacy.py
          for version in 4 6; do
            docker compose -f "docker-compose-v$version.yml" config -q
            docker compose -f "docker-compose-postgresql-v$version.yml" config -q
            test "$(docker compose -f "docker-compose-v$version.yml" config --services | wc -l)" = 2
            test "$(docker compose -f "docker-compose-postgresql-v$version.yml" config --services | wc -l)" = 3
          done
      - name: Run SQLite default-engine integration tests
        working-directory: springboot-backend
        env:
          DB_PATH: ${{ runner.temp }}/flux-integration.db
          JWT_SECRET: integration-test-secret-at-least-32-characters
          LOG_DIR: /tmp/flux-sqlite-test-logs
        run: bash ci/mvn_retry.sh maven-sqlite-test.log test
      - name: Confirm schema starts empty before testing backend auto-initialization
        run: |
          set -euo pipefail
          existing="$(psql -d flux -Atqc "SELECT COUNT(*) FROM information_schema.tables WHERE table_schema = 'public' AND table_name IN ('forward','node','speed_limit','statistics_flow','tunnel','app_user','user_tunnel','vite_config')")"
          test "$existing" = "0" || { echo "Expected empty schema, found $existing business tables"; exit 1; }
      - name: Run backend tests and package JVM artifact
        working-directory: springboot-backend
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: '5432'
          DB_NAME: flux
          DB_USER: flux
          DB_PASSWORD: test-password
          JWT_SECRET: integration-test-secret-at-least-32-characters
          LOG_DIR: /tmp/flux-test-logs
        run: |
          bash ci/mvn_retry.sh maven-test.log package
          mkdir -p jvm
          cp target/admin-0.0.1-SNAPSHOT.jar jvm/app.jar
      - name: Upload integration logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: database-integration-logs
          path: |
            springboot-backend/maven-sqlite-test.log
            springboot-backend/maven-test.log
            springboot-backend/target/surefire-reports/
          if-no-files-found: warn
      - name: Upload tested JVM JAR
        uses: actions/upload-artifact@v4
        with:
          name: tested-jvm-jar
          path: springboot-backend/jvm/app.jar
          if-no-files-found: error

  test-frontend:
    name: Verify Vite build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Build frontend
        working-directory: vite-frontend
        run: |
          npm install --legacy-peer-deps --no-audit --no-fund
          npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: tested-frontend-dist
          path: vite-frontend/dist
          if-no-files-found: error

  test-passkey-browser:
    name: Passkey browser end-to-end
    needs: [test-postgres, test-frontend]
    # Playwright's pinned Chromium supports Ubuntu 24.04, not the rolling 26.04 runner.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      DB_TYPE: sqlite
      JWT_SECRET: ci-browser-only-32-character-secret
      PASSKEY_ENABLED: 'true'
      PASSKEY_ORIGIN: http://localhost:4173
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: tested-jvm-jar
          path: browser-ci/backend
      - uses: actions/download-artifact@v4
        with:
          name: tested-frontend-dist
          path: browser-ci/dist
      - name: Install Chromium and Playwright
        run: |
          python -m pip install playwright==1.55.0
          python -m playwright install --with-deps chromium
      - name: Exercise the actual production frontend and JVM backend
        run: |
          set -euo pipefail
          export DB_PATH="$RUNNER_TEMP/flux-browser.db" LOG_DIR="$RUNNER_TEMP/flux-browser-logs"
          java -jar browser-ci/backend/app.jar > browser-ci/backend.log 2>&1 &
          pid=$!
          cleanup() {
            local result=$?
            trap - EXIT
            docker rm -f flux-browser-proxy >/dev/null 2>&1 || true
            kill "$pid" 2>/dev/null || true
            wait "$pid" 2>/dev/null || true
            if [[ "$result" != 0 ]]; then cat browser-ci/backend.log >&2; fi
            exit "$result"
          }
          trap cleanup EXIT
          sed -e 's/listen 80;/listen 4173;/' -e 's/backend:6365/127.0.0.1:6365/g' vite-frontend/nginx.conf > browser-ci/nginx.conf
          for i in $(seq 1 120); do
            if curl -fsS --max-time 1 http://127.0.0.1:6365/flow/test | grep -qx test; then break; fi
            kill -0 "$pid" 2>/dev/null || exit 1
            sleep 0.5
          done
          curl -fsS http://127.0.0.1:6365/flow/test | grep -qx test
          docker run -d --name flux-browser-proxy --network host \
            -v "$PWD/browser-ci/nginx.conf:/etc/nginx/nginx.conf:ro" \
            -v "$PWD/browser-ci/dist:/usr/share/nginx/html:ro" nginx:stable-alpine
          for i in $(seq 1 60); do
            if curl -fsS --max-time 1 http://localhost:4173/ >/dev/null; then break; fi
            sleep 0.5
          done
          python vite-frontend/tests/passkey_legacy_browser.py
          python scripts/test_passkey_browser.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: passkey-browser-log
          path: browser-ci/backend.log
          if-no-files-found: warn

  build-gost:
    name: Build GOST for amd64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.4'
          cache-dependency-path: go-gost/go.sum
      - name: Compile binaries
        working-directory: go-gost
        run: |
          set -euo pipefail
          mkdir -p ../dist
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -ldflags="-s -w" -o ../dist/gost-amd64 .
      - name: Verify node installer
        run: bash scripts/test_node_installer.sh
      - name: Generate node checksum
        run: (cd dist && sha256sum gost-amd64 > gost-amd64.sha256)
      - uses: actions/upload-artifact@v4
        with:
          name: gost-binaries
          path: dist/gost-*
          if-no-files-found: error

  publish-preview-node:
    name: Publish current SQLite preview node
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/codex/sqlite-default'
    needs: [test-postgres, test-frontend, test-passkey-browser, build-gost]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: gost-binaries
          path: dist
      - name: Publish node installer and verified binary
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/publish_preview_node.sh

  container-images:
    name: Build ${{ matrix.image }}
    needs: [test-postgres, test-frontend, test-passkey-browser, build-gost, publish-preview-node]
    if: >-
      !cancelled() && needs.test-postgres.result == 'success' &&
      needs.test-frontend.result == 'success' && needs.test-passkey-browser.result == 'success' && needs.build-gost.result == 'success' &&
      (needs.publish-preview-node.result == 'success' || needs.publish-preview-node.result == 'skipped')
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: flux-panel-backend
            context: ./springboot-backend
            target: prebuilt
          - image: flux-panel-frontend
            context: ./vite-frontend
            target: ''
    steps:
      - uses: actions/checkout@v4
      - name: Download tested JVM JAR
        if: matrix.image == 'flux-panel-backend'
        uses: actions/download-artifact@v4
        with:
          name: tested-jvm-jar
          path: springboot-backend/jvm
      - uses: docker/setup-buildx-action@v3
      - name: Login to GHCR
        if: github.event_name != 'pull_request' && github.ref != 'refs/heads/codex/passkey-auth'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Calculate image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
          flavor: latest=false
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha,prefix=sha-,format=short
            type=raw,value=sqlite-default,enable=${{ github.ref == 'refs/heads/codex/sqlite-default' }}
            type=raw,value=sqlite-jvm,enable=${{ github.ref == 'refs/heads/codex/sqlite-default' && matrix.image == 'flux-panel-backend' }}
            type=raw,value=graalvm-jvm,enable=${{ github.ref == 'refs/heads/codex/graalvm-native' }}
            type=raw,value=postgresql-support,enable=${{ github.ref == 'refs/heads/codex/postgresql-support' }}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
      - name: Build and optionally publish
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          target: ${{ matrix.target }}
          platforms: linux/amd64
          build-args: |
            FLUX_NODE_RELEASE_REPO=${{ github.repository }}
            FLUX_NODE_RELEASE_TAG=${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'sqlite-default' }}
          push: ${{ github.event_name != 'pull_request' && github.ref != 'refs/heads/codex/passkey-auth' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

  release:
    name: Publish release artifacts
    if: startsWith(github.ref, 'refs/tags/')
    needs: [test-postgres, test-frontend, test-passkey-browser, build-gost, container-images]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: gost-binaries
          path: dist
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # The downloaded installer defaults to the same immutable release tag.
          [[ "$GITHUB_REF_NAME" =~ ^[A-Za-z0-9][A-Za-z0-9._-]*$ ]]
          sed "s/FLUX_RELEASE_TAG:-sqlite-default/FLUX_RELEASE_TAG:-$GITHUB_REF_NAME/" install.sh > dist/install.sh
          bash -n dist/install.sh
          gh release create "$GITHUB_REF_NAME" \
            dist/gost-amd64 dist/gost-amd64.sha256 \
            dist/install.sh panel_install.sh \
            docker-compose-v4.yml docker-compose-v6.yml \
            docker-compose-postgresql-v4.yml docker-compose-postgresql-v6.yml \
            springboot-backend/src/main/resources/db/init/sqlite-schema.sql \
            scripts/migrate_postgresql_to_sqlite.py docs/sqlite-operations.md \
            gost.sql gost-schema.sql \
            scripts/migrate_mysql_to_postgresql.py \
            scripts/requirements-migration.txt \
            docs/postgresql-operations.md \
            docs/postgresql-default-migration-plan.md \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag --generate-notes --title "Flux Panel $GITHUB_REF_NAME"
