name: Build and Push Images Based on Version

# 在这里定义统一版本号
env:
  VERSION: "1.5.0"

on:
  push:
    branches:
      - main

jobs:
  check-version:
    name: Check Version and Decide Build
    runs-on: ubuntu-latest
    outputs:
      version: ${{ env.VERSION }}
      should_build: ${{ steps.check-tag.outputs.should_build }}
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0  # 获取所有历史和 tags

      - name: Display version
        run: |
          echo "Current version: ${{ env.VERSION }}"

      - name: Check if tag exists
        id: check-tag
        run: |
          if git rev-parse "${{ env.VERSION }}" >/dev/null 2>&1; then
            echo "Tag ${{ env.VERSION }} already exists, skip build"
            echo "should_build=false" >> $GITHUB_OUTPUT
          else
            echo "Tag ${{ env.VERSION }} does not exist, will build all components"
            echo "should_build=true" >> $GITHUB_OUTPUT
          fi

  test-postgres:
    name: PostgreSQL integration tests
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: flux
          MYSQL_USER: flux
          MYSQL_PASSWORD: test-password
          MYSQL_ROOT_PASSWORD: test-root-password
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h localhost"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 15
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: flux
          POSTGRES_USER: flux
          POSTGRES_PASSWORD: test-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U flux -d flux"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v3
        with:
          java-version: 21
          distribution: temurin
          cache: maven
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify legacy data migration
        env:
          MYSQL_HOST: 127.0.0.1
          MYSQL_PORT: 3306
          MYSQL_USER: flux
          MYSQL_PASSWORD: test-password
          MYSQL_DATABASE: flux
          PGHOST: 127.0.0.1
          PGPORT: 5432
          PGUSER: flux
          PGPASSWORD: test-password
          PGDATABASE: flux_migration
        run: |
          git show b83f6c0:gost.sql | docker exec -i ${{ job.services.mysql.id }} sh -c 'export MYSQL_PWD="$MYSQL_ROOT_PASSWORD"; exec mysql -u root flux'
          docker exec -i ${{ job.services.mysql.id }} sh -c 'export MYSQL_PWD="$MYSQL_ROOT_PASSWORD"; exec mysql -u root flux' <<'SQL'
          INSERT INTO node (id,name,secret,server_ip,port_sta,port_end,created_time,status) VALUES (11,'node','secret','127.0.0.1',1000,2000,1,1);
          INSERT INTO tunnel (id,name,in_node_id,in_ip,out_node_id,out_ip,type,flow,created_time,updated_time,status) VALUES (12,'tunnel',11,'::1',11,'::1',1,2,1,1,1);
          INSERT INTO forward (id,user_id,user_name,name,tunnel_id,in_port,remote_addr,created_time,updated_time,status) VALUES (13,1,'admin_user','forward',12,1234,'example',1,1,1);
          INSERT INTO speed_limit (id,name,speed,tunnel_id,tunnel_name,created_time,status) VALUES (14,'limit',100,12,'tunnel',1,1);
          INSERT INTO user_tunnel (id,user_id,tunnel_id,speed_id,num,flow,flow_reset_time,exp_time,status) VALUES (15,1,12,14,1,100,0,2727251700000,1);
          INSERT INTO statistics_flow (id,user_id,flow,total_flow,time,created_time) VALUES (16,1,123,456,'2026-11-24',1);
          SQL
          psql -d postgres -v ON_ERROR_STOP=1 -c 'CREATE DATABASE flux_migration'
          psql -v ON_ERROR_STOP=1 -f gost-schema.sql
          python -m pip install -r scripts/requirements-migration.txt
          python scripts/migrate_mysql_to_postgresql.py
          test "$(psql -Atc 'SELECT count(*) FROM app_user')" = 1
          if python scripts/migrate_mysql_to_postgresql.py; then exit 1; fi
          psql -d postgres -v ON_ERROR_STOP=1 -c 'CREATE DATABASE flux_migration_fail'
          export PGDATABASE=flux_migration_fail
          psql -v ON_ERROR_STOP=1 -f gost-schema.sql
          docker exec ${{ job.services.mysql.id }} sh -c 'export MYSQL_PWD="$MYSQL_ROOT_PASSWORD"; mysql -u root flux -e "ALTER TABLE vite_config ADD COLUMN unexpected_extra INT"'
          if python scripts/migrate_mysql_to_postgresql.py; then exit 1; fi
          test "$(psql -Atc 'SELECT count(*) FROM forward')" = 0
      - name: Initialize PostgreSQL
        env:
          PGPASSWORD: test-password
        run: |
          psql -h 127.0.0.1 -U flux -d flux -v ON_ERROR_STOP=1 -f gost-schema.sql
          psql -h 127.0.0.1 -U flux -d flux -v ON_ERROR_STOP=1 -f gost.sql
      - name: Run backend tests
        working-directory: ./springboot-backend
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_NAME: flux
          DB_USER: flux
          DB_PASSWORD: test-password
          JWT_SECRET: integration-test-secret-at-least-32-characters
          LOG_DIR: /tmp/flux-test-logs
        run: mvn test

  build-gost:
    name: Build & Compress GOST Binary
    needs: check-version
    if: needs.check-version.outputs.should_build == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.21'

      - name: Cache Go modules
        uses: actions/cache@v3
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Install UPX
        run: |
          wget https://github.com/upx/upx/releases/download/v4.2.1/upx-4.2.1-amd64_linux.tar.xz
          tar -xf upx-4.2.1-amd64_linux.tar.xz
          sudo mv upx-4.2.1-amd64_linux/upx /usr/local/bin/
          rm -rf upx-4.2.1-amd64_linux*

      - name: Build GOST binary
        working-directory: ./go-gost
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -ldflags="-s -w" -o gost

      - name: Compress with UPX
        working-directory: ./go-gost
        run: |
          upx --best --lzma gost

      - name: Upload GOST artifact
        uses: actions/upload-artifact@v4
        with:
          name: gost-binary
          path: ./go-gost/gost

  build-vite:
    name: Build & Push Vite Frontend
    needs: check-version
    if: needs.check-version.outputs.should_build == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Log in to DockerHub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - name: Build and push Vite Docker images
        run: |
          VERSION="${{ needs.check-version.outputs.version }}"
          docker buildx build \
            --platform linux/amd64 \
            --push \
            -t bqlpfy/vite-frontend:latest \
            -t bqlpfy/vite-frontend:${VERSION} \
            ./vite-frontend

  build-java:
    name: Build & Push Spring Boot Backend
    needs: [check-version, test-postgres]
    if: needs.check-version.outputs.should_build == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up JDK and Maven
        uses: actions/setup-java@v3
        with:
          java-version: 21
          distribution: 'temurin'

      - name: Cache Maven dependencies
        uses: actions/cache@v3
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2

      - name: Build Java JAR
        working-directory: ./springboot-backend
        run: mvn clean package -DskipTests

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Log in to DockerHub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - name: Build and push Java Docker images
        run: |
          VERSION="${{ needs.check-version.outputs.version }}"
          docker buildx build \
            --platform linux/amd64 \
            --push \
            -t bqlpfy/springboot-backend:latest \
            -t bqlpfy/springboot-backend:${VERSION} \
            ./springboot-backend

  create-release:
    name: Create Release and Tag
    needs: [check-version, build-gost, build-vite, build-java]
    if: needs.check-version.outputs.should_build == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v3

      - name: Download GOST binary
        uses: actions/download-artifact@v4
        with:
          name: gost-binary
          path: ./artifacts

      - name: Create Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${{ needs.check-version.outputs.version }}"
          
          # 创建并推送 tag
          git tag "${VERSION}" ${{ github.sha }}
          git push origin "${VERSION}"
          
          # 创建 release
          gh release create "${VERSION}" \
            --title "Release ${VERSION}" \
            --notes "Version ${VERSION}
          
          ## Components
          - **GOST Binary** (Linux AMD64, compressed with UPX)
          - **Vite Frontend** Docker Image: \`bqlpfy/vite-frontend:${VERSION}\` / \`bqlpfy/vite-frontend:latest\`
          - **Spring Boot Backend** Docker Image: \`bqlpfy/springboot-backend:${VERSION}\` / \`bqlpfy/springboot-backend:latest\`
          
          ## Installation Files
          - \`install.sh\` - GOST 客户端安装脚本
          - \`panel_install.sh\` - 面板安装脚本
          - \`gost-schema.sql\` - PostgreSQL 数据库结构
          - \`gost.sql\` - 数据库初始数据
          - \`docker-compose-v4.yml\` - Docker Compose 配置 (IPv4)
          - \`docker-compose-v6.yml\` - Docker Compose 配置 (IPv6)
          
          ## Details
          - Build date: $(date -u +%Y-%m-%dT%H:%M:%SZ)
          - Commit: ${{ github.sha }}" \
            --repo ${{ github.repository }}
          
          # 上传所有文件到 release
          echo "📤 上传 GOST 二进制..."
          gh release upload "${VERSION}" ./artifacts/gost --clobber
          
          echo "📤 上传安装脚本..."
          gh release upload "${VERSION}" ./install.sh --clobber
          gh release upload "${VERSION}" ./panel_install.sh --clobber
          
          echo "📤 上传配置文件..."
          gh release upload "${VERSION}" ./gost.sql --clobber
          gh release upload "${VERSION}" ./gost-schema.sql --clobber
          gh release upload "${VERSION}" ./scripts/migrate_mysql_to_postgresql.py --clobber
          gh release upload "${VERSION}" ./scripts/requirements-migration.txt --clobber
          gh release upload "${VERSION}" ./docs/postgresql-operations.md --clobber
          gh release upload "${VERSION}" ./docs/postgresql-default-migration-plan.md --clobber
          gh release upload "${VERSION}" ./docker-compose-v4.yml --clobber
          gh release upload "${VERSION}" ./docker-compose-v6.yml --clobber
          
          echo "✅ 所有文件已上传到 Release ${VERSION}"
