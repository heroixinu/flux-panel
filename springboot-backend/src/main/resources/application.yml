spring:
  datasource:
    # DatabaseDefaults selects SQLite or PostgreSQL at runtime (including Native Image).
    hikari:
      connection-timeout: 30000
      pool-name: HikariCP
      auto-commit: true
      connection-test-query: SELECT 1
  # Initialize the selected database before serving requests.
  # The scripts are idempotent and never overwrite existing users/settings.
  sql:
    init:
      mode: ${DB_SQL_INIT_MODE:always}
      continue-on-error: false
      data-locations: classpath:/db/init/data.sql
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB
  lifecycle:
    timeout-per-shutdown-phase: 30s

server:
  port: 6365
  tomcat:
    uri-encoding: UTF-8
    threads:
      max: 32
      min-spare: 2
    max-connections: 512
  shutdown: graceful
  error:
    whitelabel:
      enabled: false
    include-message: always
    include-binding-errors: always

mybatis-plus:
  mapper-locations: classpath*:/mapper/*Mapper.xml
#  configuration:
#    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

jwt-secret: ${JWT_SECRET}
log-dir: ${LOG_DIR:./logs}
