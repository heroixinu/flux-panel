services:
  backend:
    image: ghcr.io/heroixinu/flux-panel-backend:${BACKEND_IMAGE_TAG:-sqlite-native}
    container_name: springboot-backend
    restart: unless-stopped
    environment:
      DB_TYPE: sqlite
      DB_PATH: /app/data/flux.db
      DB_IMPORT_ENABLED: ${DB_IMPORT_ENABLED:-false}
      DB_IMPORT_DIR: /app/import
      DB_IMPORT_FILE: ${DB_IMPORT_FILE:-}
      DB_IMPORT_MAX_BYTES: ${DB_IMPORT_MAX_BYTES:-1073741824}
      JWT_SECRET: ${JWT_SECRET}
      PASSKEY_ENABLED: ${PASSKEY_ENABLED:-false}
      PASSKEY_ORIGIN: ${PASSKEY_ORIGIN:-}
      PASSKEY_RECOVERY_PASSWORD_LOGIN: ${PASSKEY_RECOVERY_PASSWORD_LOGIN:-false}
      LOG_DIR: /app/logs
      JAVA_OPTS: "-Xms32m -Xmx192m -XX:+UseSerialGC -Dfile.encoding=UTF-8 -Duser.timezone=Asia/Shanghai"
    ports:
      - "${BACKEND_PORT}:6365"
    volumes:
      - backend_logs:/app/logs
      - ./data:/app/data
      - ./import:/app/import:ro
    networks:
      - gost-network
    healthcheck:
      test: ["CMD", "sh", "-c", "curl -fsS http://127.0.0.1:6365/flow/test >/dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s

  frontend:
    image: ghcr.io/heroixinu/flux-panel-frontend:${IMAGE_TAG:-sqlite-default}
    container_name: vite-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT}:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - gost-network


volumes:
  backend_logs:
    name: backend_logs
    driver: local


networks:
  gost-network:
    name: gost-network
    driver: bridge
    enable_ipv6: true
    ipam:
      config:
        - subnet: 172.20.0.0/16 
        - subnet: fd00:dead:beef::/48